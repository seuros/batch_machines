[package]
name = "batch-machines"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded size/deadline batching with explicit feedback adaptation"
readme = "README.md"
exclude = ["src/**/tests.rs", "src/tests/", "tests/"]
keywords = ["batching", "backpressure", "latency", "adaptive", "no-std"]
categories = ["no-std", "algorithms"]
[dependencies]
flow-machines.workspace = true
feedback-machines.workspace = true
[dev-dependencies]
matryona-machines = { workspace = true, features = ["testing"] }
[lints]
workspace = true
